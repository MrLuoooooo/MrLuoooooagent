basePath: /api/v1
definitions:
  config.ModelEntry:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      chat_model:
        type: string
      embedding_model:
        type: string
      name:
        type: string
      provider:
        type: string
    type: object
  handler.FileNode:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.FileNode'
        type: array
      is_dir:
        type: boolean
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  handler.modelItem:
    properties:
      active:
        type: boolean
      is_custom:
        type: boolean
      is_local:
        type: boolean
      name:
        type: string
      provider:
        type: string
    type: object
  model.APIEnvelope:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  model.ApprovalItem:
    properties:
      action_type:
        description: brief description of the action
        type: string
      approved_at:
        type: string
      created_at:
        type: string
      full_output:
        description: complete agent output for review
        type: string
      id:
        type: string
      prompt:
        description: the original prompt that triggered this
        type: string
      reason:
        description: why approval is needed
        type: string
      risk_level:
        description: 低/中/高
        type: string
      source:
        description: '"cron" / "chat"'
        type: string
      status:
        $ref: '#/definitions/model.ApprovalStatus'
      task_name:
        description: cron job name or conversation ID
        type: string
    type: object
  model.ApprovalStatus:
    enum:
    - pending
    - accepted
    - rejected
    - expired
    type: string
    x-enum-varnames:
    - ApprovalPending
    - ApprovalAccepted
    - ApprovalRejected
    - ApprovalExpired
  model.BatchRequest:
    properties:
      agent:
        type: boolean
      tasks:
        items:
          $ref: '#/definitions/model.BatchTask'
        type: array
    required:
    - tasks
    type: object
  model.BatchTask:
    properties:
      id:
        type: string
      prompt:
        type: string
    type: object
  model.ChatRequest:
    properties:
      agent:
        type: boolean
      conversation_id:
        type: string
      question:
        type: string
      stream:
        type: boolean
    required:
    - question
    type: object
  model.ChatResponseData:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  model.ConversationItem:
    properties:
      conversation_id:
        type: string
      created_at:
        type: string
      message_count:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.CreateConversationRequest:
    properties:
      title:
        type: string
    type: object
  model.CreateConversationResponse:
    properties:
      conversation_id:
        type: string
      created_at:
        type: string
      title:
        type: string
    type: object
  model.DeleteConversationResponse:
    properties:
      conversation_id:
        type: string
    type: object
  model.DeleteDocumentResponse:
    properties:
      document_id:
        type: string
      status:
        type: string
    type: object
  model.DocumentItem:
    properties:
      chunk_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      document_id:
        type: string
    type: object
  model.FunctionCall:
    properties:
      arguments:
        type: string
      name:
        type: string
    type: object
  model.GetMessagesResponse:
    properties:
      conversation_id:
        type: string
      messages:
        items:
          $ref: '#/definitions/model.MessageItem'
        type: array
      total:
        type: integer
    type: object
  model.ListConversationsResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/model.ConversationItem'
        type: array
      total:
        type: integer
    type: object
  model.ListDocumentsResponse:
    properties:
      documents:
        items:
          $ref: '#/definitions/model.DocumentItem'
        type: array
      total:
        type: integer
    type: object
  model.MessageItem:
    properties:
      content:
        type: string
      role:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/model.ToolCall'
        type: array
    type: object
  model.ToolCall:
    properties:
      function:
        $ref: '#/definitions/model.FunctionCall'
      id:
        type: string
      type:
        type: string
    type: object
  model.UploadDocumentResponse:
    properties:
      chunk_count:
        type: integer
      document_ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  service.SkillEntry:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      prompt:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: MrLuoooooo
    url: https://github.com/MrLuoooooo/MrLuoooooagent
  description: AI Agent 后端系统。让大模型安全操控本地开发环境——读写文件、执行命令、联网搜索、查询股票、检索知识库。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/MrLuoooooo/MrLuoooooagent
  title: GoAgent Pro API
  version: 4.1.2
paths:
  /approvals:
    get:
      description: 获取所有审批项（包含已处理和待处理的）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.ApprovalItem'
                  type: array
              type: object
      summary: 列出全部审批项
      tags:
      - 审批
  /approvals/{approval_id}/decide:
    post:
      consumes:
      - application/json
      description: 接受或拒绝一个待审批的定时任务操作。
      parameters:
      - description: 审批项 ID
        in: path
        name: approval_id
        required: true
        type: string
      - description: 决策（accept=true 接受，false 拒绝）
        in: body
        name: request
        required: true
        schema:
          properties:
            accept:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 审批决策
      tags:
      - 审批
  /approvals/pending:
    get:
      description: 获取所有待审批的定时任务操作。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.ApprovalItem'
                  type: array
              type: object
      summary: 列出待审批项
      tags:
      - 审批
  /batch:
    post:
      consumes:
      - application/json
      description: 并行执行最多 10 个子任务，通过 SSE 流式推送进度。每个任务独立运行，结果汇总返回。
      parameters:
      - description: 批量任务请求（最多 10 个任务）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.BatchRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流式推送 task_start/task_done/task_error/summary/done 事件
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 批量执行任务
      tags:
      - 批量任务
  /chat:
    post:
      consumes:
      - application/json
      description: 发送一条消息给 AI，支持普通 RAG 和 Agent 模式，支持流式和非流式返回。流式模式通过 SSE 推送 token/tool_call/tool_result
        事件。
      parameters:
      - description: 聊天请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 流式响应（SSE），由 Server-Sent Events 推送 token/tool_call/tool_result/done
            事件
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 发送聊天消息
      tags:
      - 聊天
  /conversations:
    delete:
      description: 删除所有对话会话及其消息（不可恢复）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 清空所有会话
      tags:
      - 会话
    get:
      description: 获取所有对话会话列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.ListConversationsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 列出会话
      tags:
      - 会话
    post:
      consumes:
      - application/json
      description: 创建一个新的对话会话，返回会话 ID。
      parameters:
      - description: 会话标题（可选，默认'新会话'）
        in: body
        name: request
        schema:
          $ref: '#/definitions/model.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.CreateConversationResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 创建会话
      tags:
      - 会话
  /conversations/{conversation_id}:
    delete:
      description: 删除指定会话及其所有消息。
      parameters:
      - description: 会话 ID
        in: path
        name: conversation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.DeleteConversationResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 删除会话
      tags:
      - 会话
  /conversations/{conversation_id}/messages:
    get:
      description: 获取指定会话的消息历史记录。
      parameters:
      - description: 会话 ID
        in: path
        name: conversation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.GetMessagesResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 获取消息历史
      tags:
      - 会话
  /documents:
    get:
      description: 获取所有已上传的文档列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.ListDocumentsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 列出文档
      tags:
      - 文档
    post:
      consumes:
      - multipart/form-data
      description: 上传文档文件（.pdf/.txt/.md），自动进行分块、向量化并存入知识库。最大 10MB。
      parameters:
      - description: 上传文件（支持 .pdf / .txt / .md）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.UploadDocumentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 上传文档
      tags:
      - 文档
  /documents/{document_id}:
    delete:
      description: 按文档 ID 删除已上传的文档及其向量索引。
      parameters:
      - description: 文档 ID
        in: path
        name: document_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/model.DeleteDocumentResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 删除文档
      tags:
      - 文档
  /models:
    get:
      description: 获取所有可用模型列表。包含配置中的预置模型和用户自定义模型，标记当前活跃模型。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.modelItem'
                  type: array
              type: object
      summary: 列出可用模型
      tags:
      - 模型
    post:
      consumes:
      - application/json
      description: 添加一个自定义 LLM 模型到可用模型列表。
      parameters:
      - description: 自定义模型配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.ModelEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 添加自定义模型
      tags:
      - 模型
  /models/{name}:
    delete:
      description: 从可用模型列表中删除一个自定义模型。
      parameters:
      - description: 模型名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 删除自定义模型
      tags:
      - 模型
  /models/switch:
    post:
      consumes:
      - application/json
      description: 运行时切换 LLM 模型，无需重启服务。
      parameters:
      - description: 模型名称
        in: body
        name: request
        required: true
        schema:
          properties:
            model:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 切换模型
      tags:
      - 模型
  /skills:
    get:
      description: 获取所有用户自定义技能列表。技能会在 Agent 运行时注入到系统提示词中。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 列出技能
      tags:
      - 技能
    post:
      consumes:
      - application/json
      description: 添加或更新一个用户自定义技能。技能会在 Agent 执行时自动注入提示词。
      parameters:
      - description: 技能配置（name + prompt）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SkillEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 添加/更新技能
      tags:
      - 技能
  /skills/{name}:
    delete:
      description: 按名称删除一个用户自定义技能。
      parameters:
      - description: 技能名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 删除技能
      tags:
      - 技能
  /workspace:
    get:
      description: 获取当前 Agent 工作目录路径。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 获取工作目录
      tags:
      - 工作目录
    post:
      consumes:
      - application/json
      description: 设置 Agent 的当前工作目录。路径不存在时会自动创建。
      parameters:
      - description: 新的工作目录路径
        in: body
        name: request
        required: true
        schema:
          properties:
            path:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 设置工作目录
      tags:
      - 工作目录
  /workspace/dir:
    get:
      description: 列出指定目录下的文件和子目录（仅一层，不递归）。
      parameters:
      - description: 目录路径（默认当前工作目录）
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 列出目录内容
      tags:
      - 工作目录
  /workspace/drives:
    get:
      description: 列出 Windows 系统上的所有可用磁盘驱动器。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 列出磁盘驱动器
      tags:
      - 工作目录
  /workspace/tree:
    get:
      description: 以树形结构返回指定目录的内容（递归，默认深度 3 层）。
      parameters:
      - description: 起始目录路径（默认当前工作目录）
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.FileNode'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIEnvelope'
      summary: 返回目录树
      tags:
      - 工作目录
swagger: "2.0"
