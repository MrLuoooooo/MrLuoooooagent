server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
auth:
  api_key: ""
model_provider:
  mode: "auto"
  embedding_dimension: 768
  timeout: 300s
  llm_rate_limit_qps: 10
  llm_max_concurrent: 20
  model_list:
    - name: "deepseek-chat"
      provider: "openai"
      chat_model: "deepseek-chat"
      base_url: "https://api.deepseek.com/v1"
      api_key: ""   # 走 env 继承 cloud key
    - name: "qwen-plus"
      provider: "openai"
      chat_model: "qwen-plus"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""   # 走 env 继承 cloud key
    - name: "qwen3.5:9b"
      provider: "ollama"
      chat_model: "qwen3.5:9b"
      base_url: "http://host.docker.internal:11434/v1"
      api_key: "ollama"
  local:
    enabled: true
    base_url: "http://host.docker.internal:11434"
    chat_model: "qwen3.5:9b"
    embedding_model: "nomic-embed-text"

  cloud:
    enabled: true
    type: "openai"
    api_key: ""  # via GOAGENT_MODEL_PROVIDER_CLOUD_API_KEY env var
    base_url: "https://api.deepseek.com/v1"
    chat_model: "deepseek-chat"
    embedding_model: ""
vector_store:
  # mysql → RAG 走 MySQL FULLTEXT(ngram) + LLM reranker（不依赖 embedding 服务）；
  # elasticsearch → 向量检索（保留回退分支，见 fx.ProvideRetriever）
  type: "mysql"
  elasticsearch:
    addresses:
      - "http://elasticsearch:9200"
    index_name: "goagent_vectors"
    conv_index_name: "goagent_conversations"
    conv_msg_index_name: "goagent_conv_messages"
    doc_index_name: "goagent_documents"
    username: ""
    password: ""
document:
  max_file_size: 10485760
  allowed_types:
    - ".pdf"
    - ".txt"
    - ".md"
  chunk_size: 500
  chunk_overlap: 50
search:
  enabled: false
  api_key: ""
  base_url: "https://serpapi.com/search"
  engine: "google"
conversation:
  max_history: 20
  storage_type: "mysql"
mysql:
  enabled: true
  dsn: ""   # 从环境变量 MYSQL_* 拼接，见 internal/config/config.go
  max_open_conns: 20
  max_idle_conns: 5
agent:
  system_prompt: "You are GoAgent Pro. When user asks to write/create a file, call write_file(path=\"filename\", content=\"...\") immediately. Do not read existing files first. Reply in Chinese after tool completion."
  stock_system_prompt: |
    你是 GoAgent Pro 股票专精模式，专注于 A 股技术分析与基本面研究。分析框架：大势→行业→个股。每个数据点标注来源和时间。必须附风险声明。
memory:
  enabled: false
  retrieval_top_k: 5
stock:
  data_dir: "/app/data/stocks"
cron:
  enabled: false
  jobs: []
alert:
  enabled: false
  watchlist: []
  price_change_pct: 5
mcp:
  enabled: false
  servers: []
log:
  level: "info"
  file_path: "/var/log/goagent/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
