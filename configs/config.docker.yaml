# GoAgent Pro — Docker 配置
server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"

auth:
  api_key: ""

model_provider:
  mode: "auto"
  embedding_dimension: 768
  timeout: 300s
  model_list:
    - name: "deepseek-chat"
      provider: "openai"
      display: "DeepSeek Chat"
    - name: "qwen-plus"
      provider: "openai"
      display: "通义千问 Plus"
    - name: "qwen3.5:9b"
      provider: "ollama"
      display: "Qwen 3.5 9B (本地)"

  local:
    enabled: true
    base_url: "http://host.docker.internal:11434"
    chat_model: "qwen3.5:9b"
    embedding_model: "nomic-embed-text"

  cloud:
    enabled: true
    type: "openai"
    api_key: ""  # via GOAGENT_MODEL_PROVIDER_CLOUD_API_KEY env var
    base_url: "https://api.deepseek.com/v1"
    chat_model: "deepseek-chat"
    embedding_model: ""

vector_store:
  type: "elasticsearch"
  elasticsearch:
    addresses:
      - "http://elasticsearch:9200"
    index_name: "goagent_vectors"
    conv_index_name: "goagent_conversations"
    conv_msg_index_name: "goagent_conv_messages"
    doc_index_name: "goagent_documents"
    username: ""
    password: ""

document:
  max_file_size: 10485760
  allowed_types:
    - ".pdf"
    - ".txt"
    - ".md"
  chunk_size: 500
  chunk_overlap: 50

search:
  enabled: false
  api_key: ""
  base_url: "https://serpapi.com/search"
  engine: "google"

conversation:
  max_history: 20
  storage_type: "es"
agent:
  system_prompt: "You are GoAgent Pro. When user asks to write/create a file, call write_file(path=\"filename\", content=\"...\") immediately. Do not read existing files first. Reply in Chinese after tool completion."
log:
  level: "info"
  file_path: "/var/log/goagent/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
