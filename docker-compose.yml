services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: goagent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
  mysql:
    image: mysql:8.0
    container_name: goagent-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goagent-app
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs
      - GOAGENT_PROJECT_ROOT=/app
      - HOST_MNT_PREFIX=/mnt
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 容器内 /mnt 是 docker-desktop VM 的（非 WSL 的），Windows D 盘在 VM 里
      # 是 /mnt/host/d——直接挂 /mnt 会让 workspace 工具 stat /mnt/d/... 失败
      - /mnt/host/d:/mnt/d:rw
      - app_logs:/var/log/goagent
      - mcp_projects:/var/lib/goagent-projects
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
    # 依赖健康检查只保证首次启动顺序；Docker 冷启动/依赖中途重启后
    # app 需要能跟随拉起，否则会以降级状态（如 memory store nil）长期运行。
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
  web:
    image: node:22-alpine
    container_name: goagent-web
    working_dir: /app
    ports:
      - "8082:5173"
    environment:
      - VITE_API_TARGET=http://app:8080
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -c "
        if [ ! -d node_modules ] || [ -z \"$$(ls -A node_modules)\" ]; then
          npm ci
        fi &&
        npx vite --host 0.0.0.0 --port 5173
      "
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
volumes:
  es_data:
  app_logs:
  web_node_modules:
  mysql_data:
  mcp_projects:
