services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: goagent-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goagent-app
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs
      - GOAGENT_PROJECT_ROOT=/app
      - HOST_MNT_PREFIX=/mnt
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt:/mnt:rw
      - app_logs:/var/log/goagent
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: goagent-web
    ports:
      - "8081:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
volumes:
  es_data:
  app_logs:
